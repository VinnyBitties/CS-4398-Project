<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coin Flip Defense - Home</title>
	<link rel="icon" type="image/svg+xml" href="../head.svg">
	<link rel="stylesheet" href="dashboard.css">
	<link rel="stylesheet" href="home.css">
	<style>
	
	.coin-container {
		width: 150px;
		height: 150px;
		position: relative;
		display: flex;
		justify-content: center;
		perspective: 1000px;
		margin: 50px auto;
		font-size: 60px;
	}
		
	.coin {
		/*width: 150px;
		height: 150px;*/
		width: 100%;
		height: 100%;
		position: relative;
		transform-style: preserve-3d;
	}
		
	.side {
		position: absolute;
		inset: 0;
		
		width: 100%;
		height: 100%;
		
		border-radius: 50%;
		box-sizing: border-box;
		
		display: flex;
		align-items: center;
		justify-content: center;
		
		background: linear-gradient(
			135deg,
			#ffe082,
			#d99b20
		);
		
		border: 8px solid #b77b0b;
		
		/*font-size: 60px;*/
		font-weight: bold;
		
		backface-visibility: hidden;
		-webkit-backface-visibility: hidden;
	}
		
	.tails {
		transform: rotateY(180deg);
	}
		
		/* Continuous spinning */
	.spinning {
		animation: spin 0.7s linear infinite;
	}
		
	@keyframes spin {
		from {
			transform: rotateY(0deg);
		}
		
		to {
			transform: rotateY(360deg);
		}
	}
		
	/* Final landing animation */
	.landing {
		animation: none;
		transition: transform 2.5s cubic-bezier(.05, .7, .15, 1);
	}
	
	</style>
</head>
<body>
	
	<nav class="sidebar">
		<a id="here">Home</a>
		<a href="reports.html">Reports</a>
		<div class="account" id="account"></div>
	</nav>
	<audio src="coin-flip.mp3" id="coinFlip"></audio>
	<div class="page">
		<div class="content-container">
			<div class="coin-container">
				<div class="coin" id="main-coin">
					<div class="side heads">H</div>
					<div class="side tails">T</div>
				</div>
			</div>
			<div class="input-container" id="submitContent">
				<div class="drop-zone-container">
					<label id="drop-zone">
						<span id="drop-zone-text">Click or drop to upload.</span>
						<input type="file" id="file-input" accept=".exe" />
					</label>
				</div>
				<div class="link-container">
					<label>
						Or enter link: 
						<input type="text" id="link-input" class="link-input" placeholder="Enter link"></input>
					</label>
				</div>
				<div class="submit-file-link-check">
					<button onClick="sendOff()">Submit</button>
				</div>
			</div>
			<div class="progress-container" id="progressContent">
				<h2>Progress: <span id="inspecting"></span></h2>
				<div class="progress-step">
					<div class="coin" id="coin-step1">
						<div class="side heads">H</div>
						<div class="side tails">T</div>
					</div>
					<div class="progress-step-content">
						<div class="progress-type">1. Signiturte</div>
						<div class="progress-state waiting" id="progress-state-step1">Waiting</div>
					</div>
				</div>
				<div class="progress-step">
					<div>
						<div class="coin" id="coin-step2">
							<div class="side heads">H</div>
							<div class="side tails">T</div>
						</div>
					</div>
					<div class="progress-step-content">
						<div class="progress-type"><b>2. Static Analysis</b></div>
						<div class="progress-state waiting" id="progress-state-step2">Waiting</div>
					</div>
				</div>
				<div class="progress-step">
					<div>
						<div class="coin" id="coin-step3">
							<div class="side heads">H</div>
							<div class="side tails">T</div>
						</div>
					</div>
					<div class="progress-step-content">
						<div class="progress-type">3. Static ML Score</div>
						<div class="progress-state waiting" id="progress-state-step3">Waiting</div>
					</div>
				</div>
				<div class="progress-step">
					<div>
						<div class="coin" id="coin-step4">
							<div class="side heads">H</div>
							<div class="side tails">T</div>
						</div>
					</div>
					<div class="progress-step-content">
						<div class="progress-type">4. Sandbox</div>
						<div class="progress-state waiting" id="progress-state-step4">Waiting</div>
					</div>
				</div>
				<div class="progress-step">
					<div>
						<div class="coin" id="coin-step5">
							<div class="side heads">H</div>
							<div class="side tails">T</div>
						</div>
					</div>
					<div class="progress-step-content">
						<div class="progress-type">5. Behavioral ML Score</div>
						<div class="progress-state waiting" id="progress-state-step5">Waiting</div>
					</div>
				</div>
				<div class="progress-step">
					<div>
						<div class="coin" id="coin-step6">
							<div class="side heads">H</div>
							<div class="side tails waiting">T</div>
						</div>
					</div>
					<div class="progress-step-content">
						<div class="progress-type">6. Report</div>
						<div class="progress-state waiting" id="progress-state-step6">Waiting</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
	let spinning = false;
	let rotation = 0;

	const coin = document.getElementById("main-coin");
	const result = document.getElementById("result");
	
	function stopSignal() {
		if (!spinning) return;
		
		spinning = false;
		
		// Stop the infinite animation
		coin.classList.remove("spinning");
		
		// Force the browser to recognize the current state
		void coin.offsetWidth;
		
		// Decide the final result
		const heads = Math.random() < 0.5;
		
		rotation += 360;
		
		// Half rotation means tails
		if (heads) {
			rotation = Math.ceil(rotation / 360) * 360;
		} else {
			rotation = Math.ceil((rotation - 180) / 360) * 360 + 180;
		}
		coin.classList.add("landing");
		coin.style.transform = `rotateY(${rotation}deg)`;
	}
	
	function startSignal() {
		if(spinning) return;
		
		spinning = true;
		
		coin.classList.add("spinning");
		coin.classList.remove("landing");
		void coin.offsetWidth;
		playSound();
	}
	
	const progressState = [document.getElementById("progress-state-step1"), document.getElementById("progress-state-step2"),
							document.getElementById("progress-state-step3"), document.getElementById("progress-state-step4"),
							document.getElementById("progress-state-step5"), document.getElementById("progress-state-step6")];
	
	const coins = [document.getElementById("coin-step1"), document.getElementById("coin-step2"), document.getElementById("coin-step3"),
					document.getElementById("coin-step4"), document.getElementById("coin-step5"), document.getElementById("coin-step6")];
	
	if(progressState.length !== coins.length) {
		alert("Inconsistent Steps");
		throw new Error(`Inconsistent steps: ${progressState.length} ${coins.length}`);
	}
	
	function startStep(step) {
		if(step < 1 || step > coins.length) return;
		coins[step - 1].classList.add("spinning");
		coins[step - 1].classList.remove("landing");
		void coins[step - 1].offsetWidth;
		
		progressState[step - 1].classList.replace("waiting", "running");
		progressState[step - 1].textContent = "Running";
	}
	
	function endStep(step) {
		coins[step - 1].classList.remove("spinning");
		void coins[step - 1].offsetWidth;
		
		rotation += 360;
		rotation = Math.ceil((rotation - 180) / 360) * 360 + 180;
		
		coins[step - 1].classList.add("landing");
		coins[step - 1].style.transform = `rotateY(${rotation}deg)`;
		
		progressState[step - 1].classList.replace("running", "complete");
		progressState[step - 1].textContent = "Complete";
	}
	
	const coinSound = document.getElementById("coinFlip");
	function playSound() {
		coinSound.currentTime = 0;
		coinSound.play();
	}
	
	const fileInput = document.getElementById("file-input");
	const dropZone = document.getElementById("drop-zone");
	const dropZoneText = document.getElementById("drop-zone-text");
	const linkValue = document.getElementById("link-input");
	
	let submitValue = null;
	
	linkValue.addEventListener("keyup", (e) => {
		dropZoneText.textContent = "Click or drop to upload."
		submitValue = linkValue.value;
	});
	
	function handleFile(file) {
		if (!file) return;
	
		// Validate .exe extension
		if (!file.name.toLowerCase().endsWith(".exe")) {
			alert("Please select an .exe file.");
			return;
		}
	
		dropZoneText.textContent = file.name;
	
		//startSignal();
		linkValue.value = "";
		submitValue = file;
	}
	
	// Normal click-to-upload
	fileInput.addEventListener("change", (e) => {
		handleFile(e.target.files[0]);
	});
	
	// Drag over the drop zone
	dropZone.addEventListener("dragover", (e) => {
		e.preventDefault();
		e.stopPropagation();
	
		dropZone.classList.add("drag-over");
	});
	
	// Leave the drop zone
	dropZone.addEventListener("dragleave", (e) => {
		e.preventDefault();
		e.stopPropagation();
	
		dropZone.classList.remove("drag-over");
	});
	
	// Drop a file
	dropZone.addEventListener("drop", (e) => {
		e.preventDefault();
		e.stopPropagation();
	
		dropZone.classList.remove("drag-over");
	
		const file = e.dataTransfer.files[0];
		handleFile(file);
	});
	
	const submitContent = document.getElementById("submitContent");
	const progressContent = document.getElementById("progressContent");
	const inspecting = document.getElementById("inspecting");
	
	function sendOff() {
		if(submitValue == null) {
			return;
		} else if(typeof submitValue === "string") {
			console.log("submit link");
			submitContent.style.display = "none";
			progressContent.style.display = "block";
			startSignal();
			inspecting.textContent = submitValue;
		} else if(submitValue instanceof File && submitValue.name.split(".").pop() === "exe") {
			console.log("submit exe");
			submitContent.style.display = "none";
			progressContent.style.display = "block";
			startSignal();
			inspecting.textContent = submitValue.name;
		}
	}
	</script>
	<script src="../api.js"></script>
	<script>renderAccount("account", "../index.html");</script>
</body>
</html>
