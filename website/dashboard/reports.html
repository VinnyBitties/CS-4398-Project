<html>
<head>
	<html lang="en" dir="ltr">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coin Flip Defense - Reports</title>
	<link rel="icon" type="image/svg+xml" href="../tail.svg">
	<link rel="stylesheet" href="dashboard.css">
	<link rel="stylesheet" href="reports.css">
</head>
<body>
	<nav class="sidebar">
		<a href="home.html">Home</a>
		<a id="here">Reports</a>
	</nav>
	<div class="page">
		<div class="reports-container">
			<div class="list-container">
				<div class="items-container">
					<div class="titles item">
						<div class="fileLink">File/Link</div>
						<div class="status">Status</div>
						<div class="report">Report</div>
					</div>
				</div>
				<div class="items-container" id="items"></div>
			</div>
			<div id="pagination"></div>
		</div>
	</div>
	<script>
	const reports = [];
	/*for(let i = 0; i < 100; i++) {
		reports.push({name: `Item ${i + 1}`, status: `Item ${i + 1}`, report: `Item ${i + 1}`});
	}*/
	
	const itemsPerPage = 11;
	let currentPage = 1;
	
	const items = document.getElementById("items");
	const pagination = document.getElementById("pagination");
	
	const totalPages = Math.ceil(reports.length / itemsPerPage);
	
	const numPageChoices = 10;
	
	function displayItems() {
		const startIndex = (currentPage - 1) * itemsPerPage;
		const endIndex = startIndex + itemsPerPage;
		
		const pageItems = reports.slice(startIndex, endIndex);
		
		items.innerHTML = pageItems.map((item, index) => {
			ret = `<div class="item ${index % 2 == 0 ? "light" : "dark"}">`
			ret += "<div class=\"fileLink\">" + item.name + "</div>";
			ret += "<div class=\"status\">" + item.status + "</div>";
			ret += "<div class=\"report\">" + item.report + "</div>";
			ret += "</div>"
			return ret;
		}).join("");
		
		displayPagination();
	}
	
	function displayPagination() {
		pagination.innerHTML = "";
		
		const prevButton = document.createElement("button");
		prevButton.textContent = "<";
		prevButton.classList.add("pagination-button");
		prevButton.classList.add("back");
		prevButton.disabled = currentPage === 1;
		prevButton.onclick = () => {
			if(currentPage > 1) {
				currentPage--;
				displayItems();
			}
		};
		
		pagination.appendChild(prevButton);
		
		const startPage = Math.floor((currentPage - 1) / numPageChoices) * numPageChoices + 1;
		for (let page = startPage; page <= totalPages && page <= numPageChoices + startPage - 1; page++) {
			const button = document.createElement("button");
			button.textContent = page;
			button.classList.add("pagination-button");
			button.classList.toggle("active", page === currentPage);
			button.onclick = () => {
				currentPage = page;
				displayItems();
			};
			
			pagination.appendChild(button);
		}
		
		const nextButton = document.createElement("button");
		nextButton.textContent = ">";
		nextButton.classList.add("pagination-button");
		nextButton.classList.add("next");
		nextButton.disabled = currentPage === totalPages;
		nextButton.onclick = () => {
			if (currentPage < totalPages) {
				currentPage++;
				displayItems();
			}
		};

		pagination.appendChild(nextButton);
		
		const pageTracker = document.createElement("span");
		pageTracker.classList.add("page-tracker");
		
		const pageNumber = document.createElement("input");
		pageNumber.setAttribute("type", "text");
		pageNumber.value = currentPage;
		pageNumber.addEventListener("keyup", (e) => {
			if(e.key.length === 1 && (e.key < '0' || e.key > '9')) {
				pageNumber.value = pageNumber.value.slice(0, -1);
			} else if(e.key === 'Enter') {
				const integerPattern = /\d+$/;
				if(!integerPattern.test(pageNumber.value)) return;
				currentPage = Math.min(pageNumber.value, totalPages);
				currentPage = Math.max(1, currentPage);
				displayItems();
			}
		});
		pageNumber.classList.add("current-page");
		pageTracker.appendChild(pageNumber);
		const max = document.createElement("span");
		max.textContent = "/" + totalPages;
		pageTracker.appendChild(max);
		pagination.appendChild(pageTracker);
	}
	displayItems();
	</script>
</body>
</html>
