name: Static PE analyzer tests

on:
  push:
    paths:
      - "malware_detection/**"
      - ".github/workflows/static-analysis-tests.yml"
  pull_request:
    paths:
      - "malware_detection/**"
      - ".github/workflows/static-analysis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            malware_detection/requirements.txt
            malware_detection/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r malware_detection/requirements-dev.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run analyzer and report contract tests
        run: python -m unittest discover -s malware_detection/tests -v
