name: Contribution tracker

on:
  push:
    branches: ['CI/CD']
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Component branch changed']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Create planned issues or assess branch progress
        type: choice
        options: [seed, review]
        default: seed
      branch:
        description: Exact component branch (blank reviews all mapped branches)
        type: string
        required: false
      force:
        description: Reassess full branch changes from the common ancestor
        type: boolean
        default: false
      apply:
        description: Write changes to GitHub (main only; otherwise dry run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/issue_tracker.py validate
      - run: python3 -m unittest discover -s tests/contribution_tracker -v

  manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sentinel-issue-writer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preview or apply selected operation
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          MODE: ${{ inputs.mode }}
          BRANCH: ${{ inputs.branch }}
          FORCE: ${{ inputs.force }}
          APPLY: ${{ inputs.apply }}
        shell: bash
        run: |
          args=("$MODE")
          if [ "$MODE" = review ]; then
            if [ -n "$BRANCH" ]; then args+=(--branch "$BRANCH"); else args+=(--all); fi
          fi
          if [ "$FORCE" = true ]; then args+=(--force); fi
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 scripts/issue_tracker.py "${args[@]}"

  automatic:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sentinel-issue-writer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      checks: read
      statuses: read
    steps:
      # Always trusted default-branch code. No component checkout or downloaded artifacts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Refresh branch progress
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          EVENT_KIND: ${{ github.event_name }}
          COMPONENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          if [ "$EVENT_KIND" = workflow_run ]; then
            python3 scripts/issue_tracker.py review --branch "$COMPONENT_BRANCH" --apply
          else
            python3 scripts/issue_tracker.py review --all --apply
          fi
